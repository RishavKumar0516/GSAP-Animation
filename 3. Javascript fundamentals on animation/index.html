.horizontal {
  height: 400vh;
  position: relative;
}

.horizontal-sticky {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden; /* critical */
}

.horizontal-inner {
  display: flex;
  height: 100vh;
  will-change: transform;
}

.panel {
  min-width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
  background: #111;
  color: white;
}
